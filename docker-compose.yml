
services:
  db:
    image: postgres:18-alpine
    container_name: lainaamo_db
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}:5432"
      POSTGRES_PASSWORD: salasana
      POSTGRES_DB: lainaamo
    # Jos koneella on jo oma Postgres portissa 5432, aseta DB_PORT joksikin muuksi
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      # Postgres 18 vaatii mountin tähän, EI polkuun /var/lib/postgresql/data
      - lainaamo_data:/var/lib/postgresql
      # Tämän kansion skriptit ajetaan kerran, kun kanta luodaan ensimmäisen kerran
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lainaamo_data: